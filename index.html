<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Q TIMER</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0b0d10;--panel:#171b21;--line:#2b3139;--text:#fff;--muted:#8f98a6;--accent:#ffd21c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:700px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:21px;margin:0 0 4px;font-weight:900;letter-spacing:.04em}
.sub{font-size:12px;color:var(--muted)}
.mediaBox{margin:18px 0 8px;background:var(--panel);border-radius:16px;padding:12px}
.mediaRow{display:flex;gap:8px;align-items:center}
.mediaLabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#dbe1e8}
.fileBtn{display:inline-block;background:#232a33;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px}
input[type=file]{display:none}
audio{width:100%;margin-top:10px;height:38px}
video{width:100%;margin-top:10px;max-height:180px;border-radius:10px;background:#000}
.hidden{display:none!important}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:56px;font-weight:850;letter-spacing:.02em;margin:26px 0 20px}
.controls{display:flex;gap:10px}
button{appearance:none;-webkit-appearance:none;border:0;border-radius:15px;background:var(--panel);color:var(--text);font-weight:800;font-size:16px;padding:15px 18px}
#start{flex:1}
#reset{width:100px}
.mode{display:flex;gap:8px;margin:10px 0}
.mode button{flex:1;font-size:13px;padding:11px}
.mode button.active{background:var(--accent);color:#111}
#cue{width:100%;height:200px;margin-top:4px;border-radius:26px;background:var(--accent);color:#111;font-size:84px;font-weight:950;touch-action:manipulation}
#cue:active{transform:scale(.985)}
.note{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 18px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button{flex:1;font-size:13px;padding:11px}
.item{display:grid;grid-template-columns:50px 110px 1fr 38px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 2px}
.qn{font-weight:850}.tm{font-variant-numeric:tabular-nums;font-size:14px}.nameBtn{background:transparent;padding:5px 0;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.del{background:transparent;color:#838c98;padding:7px}.empty{text-align:center;color:#717b87;padding:34px 0}
input[type=text]{width:100%;background:transparent;color:white;border:0;border-bottom:1px solid #666;outline:none;font-size:16px;padding:5px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>Q TIMER</h1><div class="sub" id="status">準備OK</div></div>
    <div class="sub">LIGHTING CUE</div>
  </div>

  <div class="mediaBox">
    <div class="mediaRow">
      <div class="mediaLabel" id="mediaName">音源・動画なし（タイマーのみでも使用可）</div>
      <label class="fileBtn">ファイルを選ぶ<input id="mediaFile" type="file"></label>
    </div>
    <audio id="audio" controls preload="metadata" class="hidden"></audio>
    <video id="video" controls playsinline preload="metadata" class="hidden"></video>
  </div>

  <div id="timer" class="timer">00:00.000</div>

  <div class="controls">
    <button id="start" type="button">▶ START</button>
    <button id="reset" type="button">RESET</button>
  </div>

  <div class="mode">
    <button id="modeContinue" class="active" type="button">Qで止めない</button>
    <button id="modeStop" type="button">Qで止める</button>
  </div>

  <button id="cue" type="button">Q</button>
  <div class="note" id="modeNote">Qを押してもタイマー・音源は止まりません</div>

  <div class="tools">
    <button id="copy" type="button">Qリストをコピー</button>
    <button id="clear" type="button">Qだけ全削除</button>
  </div>

  <div id="list"><div class="empty">まだQがありません</div></div>
</div>

<script>
(function(){
  "use strict";

  var running=false, startedAt=0, carried=0, loop=null, cues=[];
  var stopOnCue=false, objectURL=null, mediaType="none";
  var timerEl=document.getElementById("timer"), statusEl=document.getElementById("status");
  var startEl=document.getElementById("start"), listEl=document.getElementById("list");
  var mediaFile=document.getElementById("mediaFile"), mediaName=document.getElementById("mediaName");
  var audio=document.getElementById("audio"), video=document.getElementById("video");

  function activeMedia(){
    if(mediaType==="audio") return audio;
    if(mediaType==="video") return video;
    return null;
  }

  function now(){return Date.now()}
  function currentElapsed(){
    var m=activeMedia();
    if(m) return (m.currentTime || 0) * 1000;
    return running ? (now()-startedAt)+carried : carried;
  }
  function fmt(ms){
    ms=Math.max(0,Math.floor(ms));
    var min=Math.floor(ms/60000), sec=Math.floor(ms/1000)%60, milli=ms%1000;
    return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(milli).padStart(3,"0");
  }
  function draw(){timerEl.textContent=fmt(currentElapsed())}
  function startLoop(){stopLoop();loop=setInterval(draw,20)}
  function stopLoop(){if(loop!==null){clearInterval(loop);loop=null}}

  async function startAll(){
    if(running) return;
    var m=activeMedia();
    if(m){
      try{
        await m.play();
        running=true;
        startEl.textContent="Ⅱ PAUSE";
        statusEl.textContent="計測中";
        startLoop();
      }catch(e){
        statusEl.textContent="このファイルはSafariで再生できません";
      }
    }else{
      startedAt=now();
      running=true;
      startEl.textContent="Ⅱ PAUSE";
      statusEl.textContent="計測中";
      startLoop();
    }
  }

  function pauseAll(){
    if(!running) return;
    var m=activeMedia();
    if(m) m.pause();
    else carried=currentElapsed();
    running=false;
    stopLoop();
    draw();
    startEl.textContent="▶ RESUME";
    statusEl.textContent="一時停止";
  }

  function toggleStart(){ running ? pauseAll() : startAll(); }

  function setMedia(file){
    if(objectURL) URL.revokeObjectURL(objectURL);
    objectURL=URL.createObjectURL(file);

    audio.pause(); video.pause();
    audio.removeAttribute("src"); video.removeAttribute("src");
    audio.load(); video.load();

    var type=(file.type || "").toLowerCase();
    var name=(file.name || "").toLowerCase();

    if(type.indexOf("video/")===0 || /\.(mp4|mov|m4v|webm)$/i.test(name)){
      mediaType="video";
      video.src=objectURL;
      video.classList.remove("hidden");
      audio.classList.add("hidden");
    }else{
      mediaType="audio";
      audio.src=objectURL;
      audio.classList.remove("hidden");
      video.classList.add("hidden");
    }

    mediaName.textContent=file.name || "選択したファイル";
    running=false;stopLoop();startedAt=0;carried=0;draw();
    startEl.textContent="▶ START";
    statusEl.textContent="ファイル読み込み完了";
  }

  mediaFile.addEventListener("change",function(){
    var file=this.files && this.files[0];
    if(!file) return;
    setMedia(file);
  });

  [audio,video].forEach(function(m){
    m.addEventListener("play",function(){
      running=true;startEl.textContent="Ⅱ PAUSE";statusEl.textContent="計測中";startLoop();
    });
    m.addEventListener("pause",function(){
      if(!m.ended){
        running=false;stopLoop();draw();startEl.textContent="▶ RESUME";statusEl.textContent="一時停止";
      }
    });
    m.addEventListener("ended",function(){
      running=false;stopLoop();draw();startEl.textContent="▶ START";statusEl.textContent="再生終了";
    });
    m.addEventListener("timeupdate",draw);
    m.addEventListener("seeked",draw);
    m.addEventListener("loadedmetadata",draw);
  });

  document.getElementById("modeContinue").onclick=function(){
    stopOnCue=false;
    this.classList.add("active");
    document.getElementById("modeStop").classList.remove("active");
    document.getElementById("modeNote").textContent="Qを押してもタイマー・音源は止まりません";
  };

  document.getElementById("modeStop").onclick=function(){
    stopOnCue=true;
    this.classList.add("active");
    document.getElementById("modeContinue").classList.remove("active");
    document.getElementById("modeNote").textContent="Qを押した瞬間にタイマー・音源を停止します";
  };

  startEl.onclick=toggleStart;

  document.getElementById("cue").onclick=function(){
    if(!running) startAll();
    var t=currentElapsed();
    cues.push({time:t,name:""});
    render();
    if(stopOnCue) setTimeout(pauseAll,0);
  };

  document.getElementById("reset").onclick=function(){
    var m=activeMedia();
    if(m){
      m.pause();
      try{m.currentTime=0}catch(e){}
    }
    running=false;stopLoop();startedAt=0;carried=0;draw();
    startEl.textContent="▶ START";statusEl.textContent="準備OK";
  };

  document.getElementById("clear").onclick=function(){cues=[];render()};

  document.getElementById("copy").onclick=function(){
    if(!cues.length)return;
    var text=cues.map(function(c,i){return "Q"+(i+1)+"\t"+fmt(c.time)+"\t"+c.name}).join("\n");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){statusEl.textContent="コピーしました"}).catch(function(){prompt("コピーしてください",text)});
    }else{
      prompt("コピーしてください",text);
    }
  };

  function render(){
    if(!cues.length){
      listEl.innerHTML='<div class="empty">まだQがありません</div>';
      return;
    }
    listEl.innerHTML=cues.map(function(c,i){
      return '<div class="item">'+
        '<div class="qn">Q'+(i+1)+'</div>'+
        '<div class="tm">'+fmt(c.time)+'</div>'+
        '<button type="button" class="nameBtn" data-n="'+i+'">'+(c.name||"名前を入力")+'</button>'+
        '<button type="button" class="del" data-d="'+i+'">×</button>'+
      '</div>';
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll("[data-n]"),function(b){
      b.onclick=function(){
        var i=parseInt(this.getAttribute("data-n"),10);
        var old=cues[i].name;
        var inp=document.createElement("input");
        inp.type="text";
        inp.value=old;
        this.replaceWith(inp);
        inp.focus();
        inp.select();
        var done=false;
        function save(){
          if(done)return;
          done=true;
          cues[i].name=inp.value.trim();
          render();
        }
        inp.onblur=save;
        inp.onkeydown=function(e){
          if(e.key==="Enter") inp.blur();
          if(e.key==="Escape"){inp.value=old;inp.blur()}
        };
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-d]"),function(b){
      b.onclick=function(){
        cues.splice(parseInt(this.getAttribute("data-d"),10),1);
        render();
      };
    });
  }

  draw();
  render();
})();
</script>
</body>
</html>
